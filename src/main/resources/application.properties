spring.application.name=Ejercicio5MyAPIGestor
server.port=${PORT:8081}

# ------------------------------------------------------------------------------
# CONEXIÓN A LA BASE DE DATOS (Clever Cloud MySQL 8.4)
# ------------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://bqwpcckukrbpgau6mbqb-mysql.services.clever-cloud.com:3306/bqwpcckukrbpgau6mbqb?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:uf6wtw4qrwyj6h2j}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:dRLc8Z4UK1a3koXUJfxI}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.show-sql=true

# ------------------------------------------------------------------------------
# PREVENCIÓN DE BLOQUEOS DDL (Incidencia 8 solventada)
# Deshabilita DDL automático para evitar transacciones aisladas durante el arranque
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none

# Dialecto MySQL 8 correspondiente al servidor real de Clever Cloud (MySQL 8.4)
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ------------------------------------------------------------------------------
# CONTROL ESTRICTO DEL POOL HIKARICP (Límite Clever Cloud: max_user_connections=5)
# Permite que dos contenedores de Render coexistan durante un rolling deploy
# ------------------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=45000
spring.datasource.hikari.connection-timeout=30000
